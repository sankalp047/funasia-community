      as="style"

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Inter:wght@400..700&display=swap"
      />
    </noscript>

    <!--
      First desktop visit plays an intro curtain. Hide the pre-rendered page
      until React draws the curtain so it doesn't flash first (see Landing.jsx).
      Must match introAlreadySeen() in src/pages/Landing.jsx.
    -->
    <script>
      try {
        if (
          location.pathname === '/' &&
          !matchMedia('(max-width: 1023px), (prefers-reduced-motion: reduce)').matches &&
          sessionStorage.getItem('fa-intro-seen') !== '1'
        ) {
          document.documentElement.classList.add('intro-pending')
          // Safety net: never keep the page hidden if the app is slow or fails
          setTimeout(function () { document.documentElement.classList.remove('intro-pending') }, 4000)
        }
      } catch (e) {}
    </script>
    <style>
      html.intro-pending body { background: #06231d; }
      html.intro-pending #root { visibility: hidden; }
    </style>
    <!--structured-data-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
